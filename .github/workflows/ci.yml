name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, Build, and Package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm check

      - name: Audit dependencies
        run: pnpm audit:dependencies

      - name: Install Playwright Chromium
        run: pnpm --filter @juner/bugtrace-recorder exec playwright install --with-deps chromium

      - name: Extension E2E and manifest audit
        run: pnpm --filter @juner/bugtrace-recorder test:e2e

      - name: Package Bugtrace Recorder
        run: pnpm package:zip

      - name: Verify Chrome zip
        run: pnpm verify:zip

      - name: Upload Bugtrace Recorder package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bugtrace-recorder-${{ github.sha }}
          path: |
            extensions/bugtrace-recorder/.output/bugtrace-recorder-*-chrome.zip
            extensions/bugtrace-recorder/.output/bugtrace-recorder-*-chrome.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
